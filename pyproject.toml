[project]
name = "agentic-circuit"
version = "0.1.0"
description = "IR-first architecture construction and graph-flow simulation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Agentic Circuit contributors" }]
dependencies = []

[project.scripts]
agentic-circuit = "agentic_circuit._cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/PTO-ISA/agentic-circuit"
Issues = "https://github.com/PTO-ISA/agentic-circuit/issues"

[tool.agentic-circuit]
contract-epoch = "0.3"
llvm-release = "22.1.8"
